name: ci

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

jobs:
  ci:
    # Reusable component CI from the org defaults repo. `secrets: inherit` passes the org-level
    # EDGECOMMONS_READ_TOKEN so cargo can fetch the private edgecommons git dependency. The repo must
    # be added to that secret's repository allow-list (org Actions secrets, via the REST API).
    permissions:
      contents: read
    uses: edgecommons/.github/.github/workflows/component-ci.yml@main
    with:
      language: RUST
    secrets: inherit

  coverage:
    # The 90% line-coverage gate (org rule; the reusable component-ci only does build/test/clippy),
    # actually RUN here. Excluded from the denominator: ONLY the thin live-runtime seam that needs a
    # live `EdgeCommons` runtime + broker, each file pinned to a reason —
    #   - `src/server.rs` — the CONFIG_COMPONENT subscription wiring (`from_runtime`, `start`/`stop`,
    #     the two async request handlers, `reply_if_requested`, `publish_pushes`, `start_source_watch`).
    #     Every remaining line `.await`s `messaging.subscribe/publish/reply` or the runtime; it is
    #     validated by the scaffold→build gate and HOST/Greengrass smoke, not unit tests. The pure
    #     helpers this file used to hold (`reject_recursive_bootstrap`, `optional_bool`, `message_body`)
    #     are factored into `src/bootstrap.rs`, which is INCLUDED and unit-tested to 100% — no tested
    #     logic is excluded.
    #   - `src/main.rs` — the binary bootstrap shim (build the runtime, hand off to the server).
    # ALL pure logic — bootstrap helpers (`bootstrap.rs`), catalog parsing/lineage (`catalog.rs`), the
    # three catalog sources + descriptor factory (`source.rs`), the coordinator's promote/serve/update/
    # reload logic (`coordinator.rs`), and token handling (`tokens.rs`) — stays IN the denominator and
    # is unit-tested to the floor. Do NOT lower this gate or exclude testable code to pass it — add tests.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Authenticate to the private edgecommons git dependency
        env:
          # Same org read token the reusable workflow uses (secrets: inherit); the repo must be on that
          # secret's allow-list. Rewrites the https git URL so cargo can fetch the private dep.
          EDGECOMMONS_READ_TOKEN: ${{ secrets.EDGECOMMONS_READ_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${EDGECOMMONS_READ_TOKEN}@github.com/edgecommons/edgecommons.git".insteadOf \
            "https://github.com/edgecommons/edgecommons.git"
          git config --global \
            url."https://x-access-token:${EDGECOMMONS_READ_TOKEN}@github.com/edgecommons/edgecommons".insteadOf \
            "https://github.com/edgecommons/edgecommons"
          git config --global \
            url."https://x-access-token:${EDGECOMMONS_READ_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Coverage gate (90% lines; messaging runtime seam excluded)
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: >
          cargo llvm-cov --fail-under-lines 90
          --ignore-filename-regex '(server|main)\.rs'
